<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package Himalaya | BỐNGFOLIO</title>
    <!-- Thêm font Playfair Display để ra cái nét sang trọng của web Nhật -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F8F9F6; /* Nền sáng hơn một tí cho giống web mẫu */
            --text-color: #1a1a1a; 
            --font-sans: 'Montserrat', sans-serif;
            --font-serif: 'Playfair Display', serif; /* Font chữ có chân sang chảnh */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* LỚP TEXTURE VÂN GIẤY (Dùng chung file hình texture.jpg ở trang chủ) */
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 0; 
            background-image: url("images/texture.jpg"); 
            background-repeat: repeat-y; background-size: 100vw auto; 
            opacity: 1; mix-blend-mode: multiply; 
        }

        /* HEADER TỐI GIẢN */
        header {
            position: fixed; top: 0; width: 100%; padding: 30px 50px;
            display: flex; justify-content: space-between; align-items: center; 
            z-index: 999; mix-blend-mode: difference; color: #fff; pointer-events: none;
        }
        .logo a {
            font-family: var(--font-sans); font-size: 14px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase; text-decoration: none;
            color: #fff; pointer-events: auto;
        }
        
        /* HERO SECTION - CHỮ KHỔNG LỒ */
        .project-hero {
            position: relative; height: 100vh; display: flex; flex-direction: column;
            justify-content: center; padding: 0 5vw; z-index: 10;
        }
        
        .project-subtitle {
            font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
            margin-bottom: 20px; color: #666;
        }

        .project-title {
            font-family: var(--font-serif); font-size: 8vw; line-height: 1;
            font-weight: 400; margin-bottom: 40px; color: #1a1a1a;
        }

        /* ẢNH TO TOÀN MÀN HÌNH */
        .project-image-full {
            position: relative; width: 100vw; height: 100vh; z-index: 10;
        }
        .project-image-full img {
            width: 100%; height: 100%; object-fit: cover;
        }

        /* ĐOẠN TEXT ĐÚNG CHUẨN THIỀN ĐỊNH */
        .project-description {
            position: relative; padding: 150px 5vw; z-index: 10;
            display: flex; justify-content: center; text-align: center;
        }
        .project-description p {
            font-family: var(--font-serif); font-size: 32px; line-height: 1.8;
            max-width: 900px; color: #333;
        }

        /* NÚT BACK VỀ TRANG CHỦ */
        .back-btn {
            display: block; text-align: center; padding: 100px 0;
            font-family: var(--font-sans); font-size: 13px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase; text-decoration: none;
            color: #1a1a1a; position: relative; z-index: 10;
            transition: opacity 0.3s;
        }
        .back-btn:hover { opacity: 0.5; }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>

    <header>
        <div class="logo">
            <a href="index.html">← BACK TO HOME</a>
        </div>
    </header>

    <section class="project-hero">
        <span class="project-subtitle">03 — Packaging Design</span>
        <h1 class="project-title">Package<br>Himalaya.</h1>
    </section>

    <section class="project-image-full">
        <!-- Tái sử dụng tấm hình packagehima.jpg sếp đã up -->
        <img src="images/packagehima.jpg" alt="Package Himalaya Full">
    </section>

    <section class="project-description">
        <p>
            An exploration of organic forms and natural color palettes. This brand packaging concept aims to revive the timeless beauty of nature, bringing a sense of artistry and craftsmanship into our everyday lives.
        </p>
    </section>

    <a href="index.html" class="back-btn">Close Project</a>

    <!-- GSAP Animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // Hiệu ứng chữ trượt lên mượt mà lúc load trang
        gsap.from(".project-subtitle", { y: 20, opacity: 0, duration: 1, delay: 0.2, ease: "power3.out" });
        gsap.from(".project-title", { y: 50, opacity: 0, duration: 1.2, delay: 0.4, ease: "power3.out" });
    </script>

</body>
</html>
